name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: timetracker
          POSTGRES_USER: timetracker
          POSTGRES_PASSWORD: timetracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U timetracker -d timetracker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://timetracker:timetracker@localhost:5432/timetracker?sslmode=disable
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go run -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.17.1 -path ../../db/migrations -database "$DATABASE_URL" up
      - run: go test ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high
